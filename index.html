<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Whisper Manor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0a11;--panel:#16121d;--panel2:#1f1929;--line:#3a2f4a;--ink:#ece6f5;--muted:#9a8fb0;--gold:#e8b04a;--ghost:#7df0c8;--blood:#e5536a;--omen:#b48ef0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;overflow:hidden}
button{font-family:inherit;cursor:pointer}
h1,h2,h3{font-family:'Playfair Display',serif;margin:0}
#app{display:flex;flex-direction:column;height:var(--appH,100dvh)}
/* setup */
#setup{position:fixed;inset:0;overflow:auto;background:radial-gradient(ellipse at top,#2a1f3a 0%,#0c0a11 65%);z-index:5;padding:22px 16px 40px}
#setup .wrap{max-width:520px;margin:0 auto}
.title{text-align:center;margin:8px 0 4px;font-size:38px;font-weight:900;text-shadow:0 0 24px rgba(125,240,200,.25)}
.sub{text-align:center;color:var(--muted);font-size:14px;margin-bottom:22px}
.box{background:rgba(22,18,29,.85);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.box h3{font-size:17px;margin-bottom:10px;color:var(--gold)}
.nums{display:flex;gap:8px}
.nums button{flex:1;padding:12px 0;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:18px;font-weight:800}
.nums button.on{background:var(--gold);color:#1a1205;border-color:var(--gold)}
.split{margin-top:10px;font-size:13px;color:var(--muted);text-align:center}
.split b{color:var(--ink)}
.seat{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.seat:last-child{border-bottom:0}
.seat .dot{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;font-size:13px}
.seat input{flex:1;min-width:0;background:#0f0c15;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:9px 10px;font-size:15px;font-family:inherit}
.tog{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.tog button{border:0;background:transparent;color:var(--muted);padding:8px 9px;font-size:13px;font-weight:600}
.tog button.on{background:var(--ghost);color:#08221a}
.cfg{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.cfg:last-child{border-bottom:0}
.cfg span{flex:1}
.cfg button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:18px;font-weight:800}
.cfg b{width:34px;text-align:center;font-size:17px;color:var(--gold)}
.big{width:100%;padding:15px;border-radius:12px;border:0;background:linear-gradient(135deg,#7df0c8,#4fc3a0);color:#06241b;font-size:18px;font-weight:800;box-shadow:0 6px 24px rgba(125,240,200,.25)}
.ghostbtn{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:15px;margin-top:10px}
.err{color:var(--blood);font-size:13px;text-align:center;min-height:18px;margin-top:6px}
/* header */
header{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--panel);border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;position:relative;z-index:2}
header .hn{font-family:'Playfair Display',serif;font-weight:900;font-size:16px;margin-right:auto}
.pill{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:4px 9px;white-space:nowrap}
.meter{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.meter i{width:8px;height:8px;border-radius:50%;background:#3b3049;display:inline-block}
.meter i.on{background:var(--omen);box-shadow:0 0 6px var(--omen)}
.haunt{background:#3b0f1a;border-color:var(--blood);color:#ffb3c0;animation:throb 1.6s infinite}
@keyframes throb{50%{box-shadow:0 0 12px rgba(229,83,106,.6)}}
.itemsbar{display:flex;gap:4px}
.itemsbar span{font-size:16px;opacity:.25;filter:grayscale(1)}
.itemsbar span.got{opacity:1;filter:none}
.tabs{display:flex;width:100%;gap:6px}
.tabs button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:13px;font-weight:600}
.tabs button.on{background:var(--panel2);color:var(--ink);border-color:var(--gold)}
.tabs button.padb{flex:none;padding:5px 9px;font-size:13px}
.tabs button .cnt{color:var(--gold);margin-left:4px}
/* board */
#boardWrap::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(4,0,10,.7) 100%);transition:opacity 2s}
#boardWrap.clear::after{opacity:0}
#boardWrap.clear{background:linear-gradient(180deg,#f7a77a 0%,#f6c89c 45%,#e9b48c 100%);transition:background 2s}
#modal.soft{background:rgba(5,3,9,.2);align-items:flex-end;backdrop-filter:none}
#modal.soft .card{max-height:55dvh}
#boardWrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 45%,#1d1628 0%,#08060c 75%)}
#cv{display:block;width:100%;height:100%;touch-action:none}
#vign{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .35s;background:radial-gradient(circle,transparent 35%,rgba(160,0,25,.75) 100%)}
#vign.on{opacity:1}
#vign.white{background:radial-gradient(circle,rgba(230,240,255,.55) 0%,rgba(200,215,255,.85) 100%);transition:opacity .08s}
#vign.gold{background:radial-gradient(circle,transparent 30%,rgba(232,170,60,.6) 100%)}
#vign.blue{background:radial-gradient(circle,transparent 30%,rgba(120,160,255,.55) 100%)}
#vign.orange{background:radial-gradient(circle,transparent 25%,rgba(255,130,50,.6) 100%)}
#trk{position:absolute;top:6px;left:6px;z-index:1;background:rgba(14,10,20,.84);border:1px solid var(--line);border-radius:10px;padding:4px 6px;font-size:11px;max-width:calc(100% - 12px);backdrop-filter:blur(3px)}
#trk .clb{margin-left:6px;padding:2px 8px;border:1px solid var(--gold);border-radius:10px;color:var(--ink)}
#trk .th{display:flex;align-items:center;gap:6px;color:var(--gold);font-weight:700;cursor:pointer;user-select:none}
#trk table{border-collapse:collapse;margin-top:3px}
#trk td{padding:2px 4px;white-space:nowrap;color:#d8cfe6}
#trk tr.me td{color:#fff;font-weight:700}
#trk tr.me td:first-child{box-shadow:inset 2px 0 0 var(--gold)}
#trk tr.out td{opacity:.45}
#trk i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
#trk .hid{color:var(--muted)}
#trk .note{font-size:10px;color:var(--ghost);margin-top:2px}
.die.roll{animation:dshake .12s infinite}
.die.land{animation:dland .35s ease-out}
.die.q{background:#3b3049;color:var(--muted)}
@keyframes dshake{0%{transform:rotate(-14deg) translateY(-2px)}50%{transform:rotate(12deg) translateY(2px)}100%{transform:rotate(-8deg)}}
@keyframes dland{0%{transform:scale(1.5)}100%{transform:scale(1)}}
.dsum{font-size:16px;min-height:22px}
.dsum b{font-size:22px;color:var(--gold)}
#vign.dark{background:radial-gradient(circle,rgba(0,0,0,.35) 20%,rgba(8,0,3,.94) 100%);transition:opacity .6s}
#vign.pur{background:radial-gradient(circle,transparent 35%,rgba(90,20,140,.7) 100%)}
.hint3d{position:absolute;left:8px;bottom:6px;font-size:11px;color:var(--muted);opacity:.7;pointer-events:none}
.recenter{position:absolute;right:8px;bottom:8px;border:1px solid var(--line);background:rgba(22,18,29,.8);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:12px}
/* compact phones */
.sm{display:none}
button,.acts button{touch-action:manipulation}
html,body{overscroll-behavior:none;-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
@media (max-width:560px),(max-height:760px){
  header{padding:5px 8px;gap:4px}
  header .hn{font-size:14px}
  .pill{font-size:11px;padding:3px 7px}
  .itemsbar span{font-size:14px}
  .tabs button{padding:5px;font-size:12px}
  #panel{padding:6px 8px calc(6px + max(env(safe-area-inset-bottom),var(--padB,0px)))}
  .who .dot{width:26px;height:26px;font-size:13px}
  .who .nm{font-size:14px}
  .who .mp b{font-size:18px}
  .acts{gap:4px}
  .acts button{padding:6px 2px;font-size:11px;border-radius:8px}
  .logline{margin-top:4px;font-size:11px}
  .hint3d{display:none}
  .recenter{padding:5px 8px;font-size:11px;bottom:6px;right:6px}
  .card{padding:16px 14px}
  .card h2{font-size:21px}
  .bigic{font-size:44px;margin:2px 0}
}
@media (max-width:520px){header .hn{display:none} .lg{display:none} .sm{display:inline}}
@media (orientation:landscape) and (max-height:540px){
  #app{display:grid;grid-template-columns:1fr minmax(280px,36vw);grid-template-rows:auto 1fr;height:var(--appH,100dvh)}
  header{grid-column:2;grid-row:1;border-left:1px solid var(--line);padding-top:max(5px,env(safe-area-inset-top))}
  header .hn{display:none}
  #boardWrap{grid-column:1;grid-row:1/3;padding-left:env(safe-area-inset-left)}
  #panel{grid-column:2;grid-row:2;overflow-y:auto;border-top:0;border-left:1px solid var(--line);padding-right:max(8px,env(safe-area-inset-right))}
  .lg{display:none} .sm{display:inline}
  .card{max-height:94dvh;padding:12px 14px}
  .card p{margin:5px 0;font-size:14px}
  .bigic{font-size:34px}
  .card .btns{margin-top:10px}
  .card .btns button{padding:9px}
}
@media (min-width:900px) and (min-height:541px){
  #app{display:grid;grid-template-columns:1fr 380px;grid-template-rows:auto 1fr;height:var(--appH,100dvh)}
  header{grid-column:2;grid-row:1;border-left:1px solid var(--line)}
  #boardWrap{grid-column:1;grid-row:1/3}
  #panel{grid-column:2;grid-row:2;overflow-y:auto;border-top:0;border-left:1px solid var(--line);padding:14px}
  #panel .acts button{padding:12px 4px;font-size:13px}
  .card{max-width:460px}
  #modal.soft .card{max-height:70dvh}
}
/* panel */
#panel{flex:none;background:var(--panel);border-top:1px solid var(--line);padding:8px 10px calc(8px + max(env(safe-area-inset-bottom),var(--padB,0px)))}
.who{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.who>div:nth-child(2){flex:1;min-width:0}
.who .ch{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#111;flex:none}
.who .nm{font-weight:800;font-size:15px;line-height:1.1}
.who .ch{font-size:11px;color:var(--muted)}
.who .mp{text-align:right;font-size:11px;color:var(--muted);flex:none}
.who .mp b{font-size:20px;color:var(--ghost);display:block;line-height:1}
.stats{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.stats span{font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:2px 6px;white-space:nowrap}
.stats .am{border-color:var(--ghost);color:var(--ghost)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.acts button{padding:9px 2px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:12px;font-weight:600;line-height:1.15}
.acts button:disabled{opacity:.3}
.acts .end{background:var(--gold);color:#1d1404;border-color:var(--gold);font-weight:800}
.acts .red{border-color:var(--blood);color:#ffb3c0}
.acts .grn{border-color:var(--ghost);color:var(--ghost)}
.strip{display:flex;gap:4px;overflow-x:auto;margin-top:7px;padding-bottom:2px}
.chip{flex:none;font-size:11px;border:1px solid var(--line);border-radius:14px;padding:3px 8px 3px 4px;display:flex;align-items:center;gap:4px;color:var(--muted)}
.chip.cur{color:var(--ink);border-color:var(--gold)}
.chip .eye{color:var(--ghost);font-weight:600;margin-left:3px}
.chip i{width:12px;height:12px;border-radius:50%;display:inline-block}
.logline{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:6px;align-items:center}
.logline span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logline button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;font-size:11px;padding:3px 7px}
.waiting{text-align:center;color:var(--muted);font-size:13px;padding:10px 0}
/* modal */
#modal{position:fixed;inset:0;background:rgba(5,3,9,.82);display:none;align-items:center;justify-content:center;z-index:20;padding:18px;backdrop-filter:blur(3px)}
#modal.on{display:flex}
.card{background:linear-gradient(170deg,#211a2c,#14101b);border:1px solid var(--line);border-radius:16px;padding:20px 18px;max-width:420px;width:100%;max-height:86dvh;overflow:auto;box-shadow:0 20px 60px #000a;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.card h2{font-size:24px;margin-bottom:8px}
.card .kind{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.card p{line-height:1.5;margin:8px 0;font-size:15px}
.card .btns{display:flex;gap:8px;margin-top:16px}
.card .btns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:15px;font-weight:700}
.card.list .btns{flex-direction:column}
.card .btns button.pri{background:var(--gold);border-color:var(--gold);color:#1d1404}
.card.ev{border-color:var(--gold)} .card.ev h2{color:var(--gold)}
.card.om{border-color:var(--omen)} .card.om h2{color:var(--omen)}
.card.gh{border-color:var(--ghost)} .card.gh h2{color:var(--ghost)}
.card.bl{border-color:var(--blood)} .card.bl h2{color:var(--blood)}
.secret{font-size:12px;color:var(--blood);border:1px dashed var(--blood);border-radius:8px;padding:6px 8px;margin-bottom:10px}
.bigic{font-size:54px;text-align:center;margin:6px 0}
.dice{display:flex;gap:5px;flex-wrap:wrap;margin:4px 0 10px}
.die{width:30px;height:30px;border-radius:7px;background:#ece6f5;color:#1a1424;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;letter-spacing:-1px}
.die.z{background:#4b4058;color:#4b4058}
.rules{font-size:14px;line-height:1.55}
.rules h3{color:var(--gold);font-size:16px;margin:14px 0 4px}
.rules ul{padding-left:18px;margin:4px 0}
.rules table{border-collapse:collapse;margin:6px 0;font-size:13px}
.rules td,.rules th{border:1px solid var(--line);padding:4px 10px;text-align:center}
.loglist{font-size:13px;line-height:1.5;color:#cfc6dd}
.loglist div{border-bottom:1px solid #2a2235;padding:4px 0}
#toast{position:fixed;top:140px;left:50%;transform:translateX(-50%);background:#241c30ee;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:13px;z-index:15;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1}
table.res{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
table.res td{padding:5px 4px;border-bottom:1px solid #2a2235}
.cdot{display:inline-block;width:16px;height:16px;border-radius:50%;vertical-align:middle}
header{padding-top:max(5px,env(safe-area-inset-top))}
#setup{padding-top:max(22px,env(safe-area-inset-top));padding-bottom:calc(40px + var(--padB,0px))}
#modal{padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom),calc(var(--padB,0px) + 10px))}
</style>
</head>
<body>
<div id="setup"><div class="wrap">
  <div class="title">🏚️ Whisper Manor</div><div class="sub" style="margin:-4px 0 8px;color:var(--gold)">Ngôi Nhà Bí Ẩn</div>
  <div class="sub">Khám phá – nghi ngờ – sống sót. Trong nhóm có kẻ không còn là người…</div>
  <div class="box"><h3>Số người chơi (tối đa 10)</h3><div id="cnts"></div><div class="split" id="split"></div></div>
  <div class="box"><h3>Chỗ ngồi</h3><div id="seats"></div></div>
  <div class="box"><h3>Tùy chỉnh luật</h3><div id="cfgs"></div></div>
  <div class="box"><h3>🌐 Chơi online nhiều máy</h3><div id="online"></div></div>
  <button class="big" id="startBtn">Bước vào ngôi nhà (chơi chung 1 máy)</button>
  <div class="err" id="err"></div>
  <button class="ghostbtn" id="rulesBtn">📜 Luật chơi</button>
</div></div>

<div id="app">
  <header id="hdr"></header>
  <div id="boardWrap"><canvas id="cv"></canvas><div id="vign"></div><div id="trk"></div><div class="hint3d">Kéo để di chuyển · chụm zoom</div><button class="recenter" id="recenter">◎ Về lượt</button></div>
  <div id="panel"></div>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ================= VIEWPORT FIT ================= */
const PADS=[0,32,64,96];
let padB=(()=>{try{const v=localStorage.getItem('wm_padB');if(v!==null)return +v}catch(e){}
  let emb=false;try{emb=window.self!==window.top}catch(e){emb=true}
  return emb&&matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<700?64:0;})();
function fitView(){const r=document.documentElement;
  const vv=window.visualViewport,h=Math.round(Math.min(window.innerHeight||1e9,vv?vv.height:1e9,r.clientHeight||1e9));
  if(h>200&&h<1e8)r.style.setProperty('--appH',h+'px');r.style.setProperty('--padB',padB+'px');}
function cyclePadB(){padB=PADS[(PADS.indexOf(padB)+1)%PADS.length];try{localStorage.setItem('wm_padB',padB)}catch(e){}fitView();
  toastLocal(padB?`⤒ Nâng bảng điều khiển ${padB}px`:'⤓ Bảng điều khiển sát đáy');}
fitView();addEventListener('resize',fitView);addEventListener('orientationchange',()=>setTimeout(fitView,250));
if(window.visualViewport)visualViewport.addEventListener('resize',fitView);

/* ================= DATA ================= */
const DIRS=[[0,-1],[1,0],[0,1],[-1,0]], OPP=[2,3,0,1], DN='NESW';
const GRID=13, C=6, GATE_MIG=10, TS=2;
const CFG={hauntAt:6,autoHaunt:10,roundLimit:30,need:3};
const FLOOR_NAME={A:'Tầng mái',G:'Tầng trệt',B:'Tầng hầm'};
const FLOORS=['A','G','B'];
const MAXP=10;

const ROOMS_G=[
 {n:'Thư viện',ic:'📚',d:'NES',s:'E'},{n:'Phòng ăn',ic:'🍽️',d:'NEW',s:'E'},
 {n:'Nhà bếp',ic:'🔪',d:'NES',s:'O'},{n:'Phòng khách',ic:'🛋️',d:'NESW',s:null},
 {n:'Hành lang dài',ic:'👣',d:'NS',s:null},{n:'Hành lang ngang',ic:'👣',d:'EW',s:null},
 {n:'Phòng nhạc',ic:'🎹',d:'NSW',s:'E'},{n:'Nhà kính',ic:'🪴',d:'SE',s:'O'},
 {n:'Phòng ngủ chủ',ic:'🛏️',d:'NEW',s:'E'},{n:'Phòng trẻ em',ic:'🧸',d:'SE',s:'O'},
 {n:'Phòng tắm',ic:'🛁',d:'NW',s:'E'},{n:'Phòng tranh',ic:'🖼️',d:'EW',s:'O'},
 {n:'Thư phòng',ic:'🖋️',d:'NSW',s:'E'},{n:'Phòng giặt',ic:'🧺',d:'NES',s:null},
 {n:'Nhà nguyện',ic:'🕯️',d:'NS',s:'O'},{n:'Ban công kín',ic:'🌙',d:'SW',s:'E'},
 {n:'Hiên sau',ic:'🍂',d:'NEW',s:null},{n:'Phòng khách nhỏ',ic:'🪑',d:'NESW',s:'E'},
];

/* ================= MOVEMENT GRAPH ================= */
function nbrs(p,k){
  const t=S.tiles[k],out=[];
  for(let i=0;i<4;i++){
    const nk=key(t.f,t.x+DIRS[i][0],t.y+DIRS[i][1]),u=S.tiles[nk];
    if(!u)continue;
    if(p.role==='human'&&S.locks&&S.locks[nk]>=S.round)continue;
    if(isRG(p)||(t.doors[i]&&u.doors[OPP[i]]))out.push(nk);
  }
  if(t.room.st&&LINKS[k])out.push(LINKS[k]);
  return out;
}
function frontier(k){
  const t=S.tiles[k],out=[];
  if(!S.decks[t.f].length)return out;
  for(let i=0;i<4;i++){const x=t.x+DIRS[i][0],y=t.y+DIRS[i][1];
    if(t.doors[i]&&inGrid(x,y)&&!S.tiles[key(t.f,x,y)])out.push(i);}
  return out;
}
function bfs(p,start,avoid){
  const dist={[start]:0},prev={},q=[start];
  while(q.length){const k=q.shift();
    for(const n of nbrs(p,k)){if(n in dist)continue;
      if(avoid&&revealedGhostsAt(n).length)continue;
      dist[n]=dist[k]+1;prev[n]=k;q.push(n);}}
  return {dist,prev};
}
function firstStep(prev,start,target){let k=target;while(prev[k]!==start){k=prev[k];if(k===undefined)return null}return k}

function pickup(p){
  if(p.role!=='human')return;const k=pk(p);
  S.items.filter(it=>it.drop===k).forEach(it=>{it.drop=null;it.holder=p.id;if(it.isKey)p.key=true;
    log(`${p.name} nhặt được ${it.ic} ${it.name}.`);toast(`${p.name} nhặt ${it.ic} ${it.name}`);G3.sparkle(p.f,p.x,p.y,0xe8b04a)});
}

  const t=S.tiles[k];S.mp--;p.f=t.f;p.x=t.x;p.y=t.y;S.view=p.f;pickup(p);render();G3.focus(p);
  await enterRoom(p);
  await checkWin();
}
async function doExplore(p,fromK,dir){
  const ft=S.tiles[fromK],x=ft.x+DIRS[dir][0],y=ft.y+DIRS[dir][1],f=ft.f;
  const room=S.decks[f].pop();
  const base=parseD(room.d);let best=0,bs=-1;
  for(let r=0;r<4;r++){
    const d=[0,0,0,0];for(let i=0;i<4;i++)d[(i+r)%4]=base[i];
    if(!d[OPP[dir]])continue;
    let sc=0;for(let i=0;i<4;i++){if(!d[i])continue;const nx=x+DIRS[i][0],ny=y+DIRS[i][1];
      if(!inGrid(nx,ny))continue;const u=S.tiles[key(f,nx,ny)];if(!u)sc+=1;else if(u.doors[OPP[i]])sc+=1.2;}
    sc+=Math.random()*.5;if(sc>bs){bs=sc;best=r}
  }
  placeTile(room,f,x,y,best);
  log(`${p.name} khám phá ra «${room.n}».`);
  S.mp--;p.f=f;p.x=x;p.y=y;S.view=f;pickup(p);render();G3.focus(p);p.st.explored++;
  await enterRoom(p);
  if(room.s){S.mp=0;render();await sleep(450);await drawCard(p,room.s);}
  if(room.exit&&!p.bot)toast(S.haunt?`${room.n}! Cần 🗝️ Chìa khóa + 2 bảo vật để mở.`:`${room.n} khóa chặt… sẽ mở khi Cơn Ám bắt đầu.`);
  await checkWin();
}

  p[k]=Math.max(min,Math.min(12,p[k]+d));
  if(k==='san'&&p.san<=0&&p.role==='human'){(S.pending=S.pending||[]);if(!S.pending.includes(p))S.pending.push(p);}
}
function clue(p,ghostVoice,onlyKey){
  return giveFrag(p,{key:onlyKey});
  let open=S.items.filter(it=>it.holder===null&&!it.drop);
  if(onlyKey)open=open.filter(i=>i.isKey);
  if(!open.length)return onlyKey?'Tiếng leng keng tắt lịm… có lẽ chiếc chìa khóa đã có chủ.':'Bạn cảm thấy mọi bảo vật đã được tìm thấy…';
  const fresh=open.filter(it=>p.clues[it.id]!==it.room);
  const it=pick(fresh.length?fresh:open);p.clues[it.id]=it.room;
  return `${ghostVoice?'Ngôi nhà thì thầm với đồng loại':'Bạn mơ hồ cảm thấy'}: <b>${it.ic} ${it.name}</b> đang ở <b>«${it.room}»</b> (${FLOOR_NAME[ROOM_FLOOR[it.room]]}).`;
}

async function drawCard(p,sym){
  if(sym==='E'){
    if(!S.events.length)S.events=shuffle(EVENTS.slice());
    const c=S.events.pop();const body=c.fn(p);
    if(p.role==='ghost')drawGCard(p);

  await modal(`<div class="kind">Giao chiến · công khai</div><h2>${esc(att.name)} ⚔️ ${esc(def.name)}</h2>

  if(hit)G3.evStop();

const ALLROOMS=[...ROOMS_G,...ROOMS_B,...ROOMS_A];
const roomDef=n=>ALLROOMS.find(r=>r.n===n);
const GENERIC=new Set(['Phòng','Hầm','Nhà','Hành','lang','Kho','Cầu','thang','cũ','chủ','nhỏ']);
const FTYPES=['floor','sym','doors','word'];
function fragOf(type,room){const r=roomDef(room);
  if(type==='floor')return {type,v:ROOM_FLOOR[room]};
  if(type==='sym')return {type,v:r.s||'-'};
  if(type==='doors')return {type,v:r.d.length};
  const ws=room.split(' ').filter(w=>!GENERIC.has(w));return {type,v:ws.length?pick(ws):room.split(' ').pop()};}
function fragText(f){return f.type==='floor'?`ở <b>${FLOOR_NAME[f.v]}</b>`:f.type==='sym'?(f.v==='E'?'ở phòng có <b>✦</b>':f.v==='O'?'ở phòng có <b>☾</b>':'ở phòng <b>không có ✦/☾</b>'):f.type==='doors'?`ở phòng có <b>${f.v} cửa</b>`:`tên phòng có chữ <b>«${f.v}»</b>`}
function fragMatch(n,f){const r=roomDef(n);if(!r)return false;return f.type==='floor'?ROOM_FLOOR[n]===f.v:f.type==='sym'?(r.s||'-')===f.v:f.type==='doors'?r.d.length===f.v:n.split(' ').includes(f.v)}
function candidates(p,id){const fs=(p.frags||{})[id];if(!fs||!fs.length)return null;return ALLROOMS.map(r=>r.n).filter(n=>fs.every(f=>fragMatch(n,f)))}
function giveFrag(p,opts={}){
  let open=S.items.filter(it=>it.holder===null&&!it.drop);
  if(opts.key)open=open.filter(i=>i.isKey);
  if(!open.length)return opts.key?'Tiếng leng keng tắt lịm… chiếc chìa khóa đã có chủ.':'Mọi bảo vật dường như đã được tìm thấy…';
  p.frags=p.frags||{};
  const need=it=>FTYPES.filter(t=>!(p.frags[it.id]||[]).some(f=>f.type===t));
  const pool=open.filter(it=>need(it).length&&(!opts.type||need(it).includes(opts.type)));
  if(!pool.length)return 'Bạn không tìm thấy điều gì mới…';
  const started=pool.filter(it=>(p.frags[it.id]||[]).length);
  const it=(started.length&&Math.random()<.6)?pick(started):pick(pool);
  const type=opts.type||pick(need(it));
  const f=fragOf(type,it.room);(p.frags[it.id]=p.frags[it.id]||[]).push(f);
  return `Mảnh gợi ý: <b>${it.ic} ${it.name}</b> ${fragText(f)}.`;
}
function fakeFrag(p){const open=S.items.filter(it=>it.holder===null&&!it.drop);if(!open.length)return null;
  const it=pick(open),wrong=pick(ALLROOMS.filter(r=>r.n!==it.room)).n;p.frags=p.frags||{};
  const have=(p.frags[it.id]||[]).map(f=>f.type),types=FTYPES.filter(t=>!have.includes(t));
  const f=fragOf(types.length?pick(types):pick(FTYPES),wrong);f.fake=true;(p.frags[it.id]=p.frags[it.id]||[]).push(f);return it;}

async function houseEvent(){
  if(!S.hevents||!S.hevents.length)S.hevents=shuffle(HOUSE_EVENTS.slice());
  const e=S.hevents.pop(),ps=S.players.filter(p=>!p.escaped);
  log(`${e.ic} Sự kiện Ngôi nhà: «${e.t}».`);
  const viewP=cur();if(viewP&&!viewP.escaped){S.view=viewP.f;render();G3.focus(viewP);}
  G3.evStart(e.id);
  await modal(`<div class="kind">Sự kiện Ngôi nhà · sau ${S.turnCount} lượt · ảnh hưởng tất cả</div><div class="bigic">${e.ic}</div><h2>${e.t}</h2><p>${e.d}</p>`,[{t:'Đối mặt',v:1,c:'pri'}],'om soft');
  const rolls=[],vs=[];
  for(const p of ps){const k=e.rs?e.rs(p):null;
    if(k){const r=await rollFor(p,p[k],`${e.ic} ${e.t}`,`<b>${esc(p.name)}</b> đổ ${ICON[k]} ${STATN[k]} (${p[k]} xúc xắc).${!p.bot&&humanSeats()>=2?' Đưa máy cho '+esc(p.name)+'.':''}`,true);rolls.push(r);vs.push(sum(r));}
    else{rolls.push(null);vs.push(null);}}
  const res=e.all?e.all(ps,vs):ps.map((p,i)=>e.res(p,vs[i]));
  ps.forEach((p,i)=>G3.floatText(p,res[i]));
  render();await sleep(1100);
  await modal(`<div class="kind">Kết quả · công khai</div><h2>${e.ic} ${e.t}</h2>
    <table class="res">${ps.map((p,i)=>`<tr><td><span class="cdot" style="background:${p.color}"></span></td><td>${esc(p.name)}${isRG(p)?' 👻':''}</td><td>${rolls[i]?dz(rolls[i])+' ':''}${res[i]}</td></tr>`).join('')}</table>`,[{t:'Tiếp tục',v:1,c:'pri'}],'om soft');
  G3.evStop();
  render();await resolvePending();
}
async function advance(count=true){
  if(count)S.turnCount++;
  if(count&&S.turnCount%10===0){await houseEvent();if(S.over)return;}
  S.turn=(S.turn+1)%S.players.length;
  if(S.turn===0){S.round++;
    if(S.round>CFG.roundLimit)return endGame('ghost','Bình minh không bao giờ tới… ngôi nhà đã giam giữ tất cả.');
    if(!S.haunt&&S.round>=CFG.autoHaunt)await startHaunt();
  }
}
async function runTurns(){
  while(!S.over){
    const p=cur();
    if(p.escaped){await advance(false);continue;}
    S.busy=true;
    const go=await beginTurn(p);
    if(S.over)return;
    if(!go){await advance();continue;}
    if(p.bot){await sleep(350);await botTurn(p);if(S.over)return;await sleep(300);await advance();continue;}
    S.busy=false;render();return;
  }
}
async function humanDo(fn,ends){
  if(!S||S.busy||S.over)return;const p=cur();if(p.bot)return;
  S.busy=true;render();
  await fn(p);
  if(S.over)return;
  if(ends){await advance();await runTurns();}
  else{S.busy=false;render();}
}

/* ================= BOTS ================= */
function gateWant(p){return canOpen(p)&&(p.greedy||humanItemsCount()<CFG.need-1);}
function botTargets(p){
  const out=new Set();
  for(const it of S.items){if(it.holder!==null||it.drop)continue;
    if(p.role!=='human'){if(p.clues[it.id]&&it.hidBy===null)out.add(p.clues[it.id]);continue;}
    if(S.known[it.id])out.add(S.known[it.id]);
    const c=candidates(p,it.id);if(c&&c.length<=3)c.filter(n=>!p.searchedRooms.has(n)).forEach(n=>out.add(n));}
  return out;
}
function wantsSearchHere(p){
  if(S.searched)return false;
  const n=S.tiles[pk(p)].room.n;
  if(p.role==='human')return botTargets(p).has(n)&&!p.searchedRooms.has(n);
  return S.items.some(it=>it.holder===null&&!it.drop&&p.clues[it.id]===n&&it.room===n&&it.hidBy===null);
}
function botStep(p){
  const here=pk(p),avoid=p.role==='human'&&S.haunt;
  const {dist,prev}=bfs(p,here,avoid);
  const go=k=>{if(k===here)return null;const s=firstStep(prev,here,k);return s?{type:'move',k:s}:null};
  const nearest=ks=>{let b=null,bd=1e9;for(const k of ks)if(k in dist&&dist[k]<bd){bd=dist[k];b=k}return b};
  if(isRG(p)){const tgt=nearest(humans().map(pk));if(tgt)return go(tgt);}
  else{
    if(p.role==='human'&&S.haunt&&S.exitKey&&gateWant(p)){const k=S.exitKey;if(k in dist)return go(k);}
    const known=[...botTargets(p)].filter(n=>S.byName[n]&&!(p.role==='human'&&p.searchedRooms.has(n))).map(n=>S.byName[n]);
    const tk=nearest(known);if(tk&&tk!==here)return go(tk);
  }
  let best=null,bd=1e9;
  for(const k in dist){const fr=frontier(k);if(fr.length&&dist[k]<bd){bd=dist[k];best=[k,pick(fr)]}}
  if(best){if(best[0]===here)return {type:'explore',from:here,dir:best[1]};return go(best[0]);}
  const ns=nbrs(p,here);return ns.length?{type:'move',k:pick(ns)}:null;
}
function botWantsReveal(p){
  if(S.haunt||S.round<4)return false;
  const {dist}=bfs({...p,revealed:true},pk(p));
  return humans().some(h=>(dist[pk(h)]??99)<=p.spd+1)&&Math.random()<0.45;
}
async function botExtras(p){
  if(p.role==='human'){
    const has=id=>S.items.some(i=>i.holder===p.id&&i.id===id);
    if(has('bua')&&ITEM_POW.bua.ok(p)){await useItem(p,'bua');return;}
    if(has('chuong')&&ITEM_POW.chuong.ok(p)&&Math.random()<.5){await useItem(p,'chuong');return;}
  } else if(p.gcards.length&&Math.random()<.6){
    const id=pick(p.gcards),k=pk(p),t=S.tiles[k];
    if((id==='trap'||id==='lock')&&(t.room.start||t.room.exit||S.traps[k]!==undefined))return;
    const hs=humans();if(GCARDS.find(c=>c.id===id).target&&!hs.length)return;
    await playGCard(p,id,hs.length?pick(hs).id:null);
  }
}
function botLikesRoom(p){const a=roomAct(p);if(!a)return false;
  if(/Tinh thần/.test(a.d)&&!/mất/.test(a.d))return p.san<=3;
  if(a.n==='Phòng ngủ chủ')return p.san<=2;if(a.n==='Phòng nhạc')return false;if(a.n==='Hầm rượu')return p.san>=4;
  return true;}
async function botTurn(p){
  if(p.role==='ghost'&&!p.revealed&&botWantsReveal(p))await reveal(p);
  await botExtras(p);if(S.over)return;
  let guard=0;
  while(!S.over&&guard++<24){
    const here=pk(p);
    if(isRG(p)&&!S.acted){const prey=humansAt(here);if(prey.length){await doAttack(p,prey.sort((a,b)=>a.san-b.san)[0]);return;}}
    if(p.role==='human'&&S.haunt&&S.tiles[here].room.exit&&gateWant(p)){await openGate(p);return;}
    if(!isRG(p)&&wantsSearchHere(p)){await doSearch(p);return;}
    if(S.mp<=0)break;
    const st=botStep(p);if(!st)break;
    if(st.type==='move')await doMove(p,st.k);else await doExplore(p,st.from,st.dir);
    await sleep(480);
  }
  if(!S.over&&!isRG(p)&&roomReady(p)&&botLikesRoom(p))await useRoom(p);
}

   <div class="tabs">${[['A','🏚️ Mái'],['G','🏠 Trệt'],['B','🕳️ Hầm']].map(([f,l])=>`<button data-view="${f}" class="${S.view===f?'on':''}">${l}<span class="cnt">${cnt(f)||''}</span></button>`).join('')}<button class="padb" data-padb="1" title="Nâng bảng điều khiển nếu bị che ở đáy màn hình">⤒</button></div>`;
  G3.sync();

      <button data-a="end" class="end" ${dis?'disabled':''}>Kết thúc<br>lượt ➜</button></div>`;
  } else if(!S.over) acts=`<div class="waiting">${p.bot?'🤖':'⏳'} ${esc(p.name)} ${p.bot?'đang hành động…':'đang chơi lượt của mình…'}${NET.on&&viewer()?` <br><button data-a="note" style="margin-top:6px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 12px">📓 Sổ tay của tôi</button>`:''}</div>`;
  else acts=`<div class="acts"><button data-a="new" class="end" style="grid-column:span 3">🔁 Ván mới</button><button data-a="log">📜<br>Nhật ký</button></div>`;
  const ghostEye=false;

  $('#trk').innerHTML=`<div class="th"><span data-trk="1">📊 Theo dõi ${trkOpen?'▾':'▸'}</span><span data-clue="1" class="clb">🧩 Gợi ý ${Object.values(S.frags).reduce((a,f)=>a+f.length,0)+Object.keys(S.known).length}</span></div>${trkOpen?`<table>${S.players.map(q=>{const seeM=q===viewer();
    return `<tr class="${q===p?'me':''}${NET.on&&q===viewer()?' you':''} ${q.escaped?'out':''}"><td><i style="background:${q.color}"></i>${esc(q.name)}${isRG(q)?' 👻'+q.am:''}${q.skip?'💤':''}</td><td>${q.escaped?'🚪thoát':FS[q.f]}</td><td>🏃${q.spd}</td><td>${seeM?'💪'+q.mig:'<span class="hid">💪?</span>'}</td><td>🧠${q.san}</td><td>${S.items.filter(i=>i.holder===q.id).map(i=>i.ic).join('')}</td></tr>`}).join('')}</table>`:''}`;
  $('#panel').innerHTML=`<div class="who"><div class="dot" style="background:${p.color}">${esc(p.name[0])}</div>

     <div class="stats"><span>🏃${p.spd}</span><span>💪${p.mig}</span><span>🧠${p.san}</span>${isRG(p)?`<span class="am">👻${p.am}</span>`:''}${items?`<span>${items}</span>`:''}</div>
     <div class="mp"><b>${Math.max(0,S.mp)}</b>bước</div></div>
   ${acts}
   <div class="logline"><span>${S.log[S.log.length-1]||'Ngôi nhà im lặng…'}</span><button data-a="log">📜 Nhật ký</button></div>`;
}

function modal(html,buttons=[{t:'OK',v:1,c:'pri'}],cls=''){
  if(NET.on&&NET.host&&S&&NET.started&&!S.over)return hostModal(html,buttons,cls);
  return localModal(html,buttons,cls);
}
function localModal(html,buttons=[{t:'OK',v:1,c:'pri'}],cls=''){
  return new Promise(res=>{
    const m=$('#modal');
    m.innerHTML=`<div class="card ${cls}">${html}<div class="btns">${buttons.map((b,i)=>`<button data-i="${i}" class="${b.c||''}">${b.t}</button>`).join('')}</div></div>`;
    m.classList.add('on');m.classList.toggle('soft',/\bsoft\b/.test(cls));m._finish=null;m.dataset.kind='local';
    m.onclick=e=>{const b=e.target.closest('button[data-i]');if(!b)return;m.classList.remove('on','soft');m.innerHTML='';m.onclick=null;res(buttons[+b.dataset.i].v);};
  });
}
function clueBoard(){
  const rows=S.items.map(it=>{const fs=S.frags[it.id]||[];const kn=S.known[it.id];if(!fs.length&&!kn)return '';
    const c=fs.length?candidates(S.players[0],it.id):[];
    const list=!fs.length?'':c.length?c.map(n=>{const sr=S.empty.has(n);return `<span style="${sr?'text-decoration:line-through;opacity:.5':''}">${S.byName[n]?'<b>'+n+'</b>':n}</span>`}).join(', '):'<b style="color:var(--blood)">không phòng nào khớp – có mảnh gợi ý sai, hoặc bảo vật đã bị dời!</b>';
    return `<li>${it.ic} <b>${it.name}</b>${it.holder!==null?` ✔️ ${esc(S.players[it.holder].name)} đang giữ`:''}
      ${kn?`<br>📌 Nhật ký từng chỉ: <b>«${kn}»</b>`:''}
      ${fs.length?`<br>${fs.map(f=>fragText(f)).join(' · ')}<br><span style="font-size:13px;color:#cfc6dd">→ Phòng khớp (${c.length}): ${list}</span>`:''}</li>`}).join('');
  return `<div class="kind">Công khai · cả bàn cùng xem</div><h2>🧩 Bảng gợi ý</h2>
   <p style="font-size:13px;color:var(--muted)">Mọi mảnh gợi ý ai bốc được đều ghi ở đây. Phòng in đậm = đã mở; gạch ngang = đã có người lục mà không thấy. Cẩn thận: Ma có thể lén gieo mảnh sai, hoặc dời bảo vật đi!</p>
   <ul>${rows||'<li>Chưa có mảnh gợi ý nào. Bốc thẻ ✦ hoặc dùng ✨ Thư viện, Kho rương, Đài quan sát…</li>'}</ul>`;
}
function notebook(p){
  const allies=S.players.filter(q=>q!==p&&q.role==='ghost');
  const exact=Object.entries(p.clues).map(([id,r])=>{const it=S.items.find(i=>i.id===id);return `<li>${it.ic} ${it.name} → <b>«${r}»</b> (${FLOOR_NAME[ROOM_FLOOR[r]]})${it.holder!==null?' ✔️ đã có người giữ':''}</li>`}).join('');
  const frs=S.items.map(it=>{const fs=(p.frags||{})[it.id];if(!fs||!fs.length)return '';const c=candidates(p,it.id);
    const list=c.length?c.map(n=>{const sr=p.searchedRooms.has(n);return `<span style="${sr?'text-decoration:line-through;opacity:.5':''}">${S.byName[n]?'<b>'+n+'</b>':n}</span>`}).join(', '):'<b style="color:var(--blood)">không phòng nào khớp – có mảnh gợi ý sai, hoặc bảo vật đã bị dời!</b>';
    return `<li>${it.ic} <b>${it.name}</b>${it.holder!==null?' ✔️ đã có người giữ':''}<br>${fs.map(f=>fragText(f)).join(' · ')}<br><span style="font-size:13px;color:#cfc6dd">→ Phòng khớp (${c.length}): ${list}</span></li>`}).join('');
  const gl=p.goal&&p.role==='human'?`<p>🎯 <b>Mục tiêu bí mật: ${p.goal.t}</b> – ${p.goal.d} ${p.goal.ok(p)?'✔️ <b style="color:var(--ghost)">đã đạt</b>':''}<br><span style="font-size:13px;color:var(--muted)">Hoàn thành được +4 điểm MVP khi phe Người thắng. Điểm hiện tại: <b>${scoreOf(p)}</b></span></p>`:'';
  const hid=p.role==='ghost'?hiddenByGhosts():[];
  const traps=Object.entries(S.traps).map(([k,o])=>`«${S.tiles[k].room.n}» (${FLOOR_NAME[S.tiles[k].f]}, của ${esc(S.players[o].name)})`).join(', ');
  return `<div class="secret">🔒 Sổ tay riêng của ${esc(p.name)}</div><h2>${p.role==='ghost'?'👻 Bạn là MA':'🧍 Bạn là NGƯỜI'}</h2>
   ${p.role==='ghost'?`<p>Mục tiêu: biến tất cả người sống thành Ma (hoặc cầm chân tới hết vòng ${CFG.roundLimit}). ${p.revealed?'':'Bạn đang ẩn mình: hành động như người thường, dùng 🎒 Túi để chơi <b>Bài Ma</b> hoặc <b>Hiện hình</b>.'} Ám (bí mật): <b>${p.am}</b>.</p>${allies.length?`<p>Đồng loại: <b>${allies.map(a=>esc(a.name)).join(', ')}</b></p>`:''}
     <p>🃏 Bài Ma đang có: <b>${p.gcards.length?p.gcards.map(id=>GCARDS.find(c=>c.id===id).t).join(', '):'chưa có'}</b>${traps?`<br>🪤 Bẫy đang giăng: ${traps}`:''}</p>
     <p><b>👁️ Chỉ số mọi người (chỉ Ma thấy):</b></p><table class="res">${S.players.filter(q=>q!==p&&!q.escaped).map(q=>`<tr><td><span class="cdot" style="background:${q.color}"></span></td><td>${esc(q.name)}${q.role==='ghost'?' 👻':''}</td><td>💪${q.mig} 🧠${q.san} 🏃${q.spd}${q.role==='ghost'?' · Ám '+q.am:''}</td></tr>`).join('')}</table>
     <p><b>👁️ Bảo vật đồng loại đã giấu/dời:</b></p><ul>${hid.length?hid.map(i=>`<li>${i.ic} ${i.name} → «${i.room}» (${FLOOR_NAME[ROOM_FLOOR[i.room]]}), bởi ${esc(S.players[i.hidBy].name)}</li>`).join(''):'<li>Chưa có.</li>'}</ul>
     ${exact?`<p><b>Vị trí bạn biết chắc:</b></p><ul>${exact}</ul>`:''}`
   :`<p>Mục tiêu phe: gom đủ <b>${CFG.need} bảo vật</b>, hoặc đủ người <b>thoát ra</b> sau khi Cơn Ám bắt đầu.</p>${gl}
     <p>🧩 Mảnh gợi ý giờ là <b>công khai</b>: xem ở nút <b>🧩 Gợi ý</b> góc trên bản đồ.</p>
     ${exact?`<p><b>📌 Vị trí biết chắc:</b></p><ul>${exact}</ul>`:''}`}`;
}
function rulesHTML(){return `<div class="rules"><h2>🏚️ Whisper Manor · Luật chơi</h2>
<h3>1. Vào game</h3><ul><li>Chọn số <b>🧍 Người</b> và <b>👻 Ma</b> (tối đa 10 người chơi, tối thiểu 2 Người + 1 Ma), nhập tên từng ghế. Ghế nào không có người thì bật 🤖 để máy chơi thay.</li>
<li>Bấm <b>Bước vào ngôi nhà</b>, game chia vai bí mật ngẫu nhiên. Mỗi người xem vai của mình trong 📓 Sổ tay. Ma biết đồng loại là ai và biết sẵn chỗ 1 bảo vật.</li></ul>
<h3>2. Trong lượt của bạn</h3><ul>
<li><b>Di chuyển:</b> chạm vào phòng đang sáng viền xanh để đi. Số bước tối đa bằng 🏃 Tốc độ.</li>
<li><b>Khám phá:</b> chạm vào ô <b>?</b> (viền nét đứt) để mở phòng mới.</li>
<li>Phòng có <b style="color:var(--gold)">✦</b>: bốc <b>thẻ Sự kiện</b>, nội dung <b>công khai</b> cho cả bàn.</li>
<li>Phòng có <b style="color:var(--omen)">☾</b>: bốc <b>Điềm báo</b> công khai, Tà khí +1.</li>
<li>⇅ <b>Cầu thang:</b> nhà có 3 tầng: 🏚️ Tầng mái, 🏠 Tầng trệt, 🕳️ Tầng hầm. Đứng ở ô cầu thang để lên/xuống (Cầu thang lên ↔ Chiếu nghỉ gác mái, Cầu thang xuống ↔ Chân cầu thang).</li>
<li>🔎 <b>Lục soát:</b> tìm bảo vật hoặc 🗝️ chìa khóa trong phòng (kết thúc lượt). Nếu Ma lục soát trúng phòng có bảo vật, Ma sẽ lén giấu nó sang phòng khác.</li>
<li>👻 <b>Hiện hình:</b> chỉ Ma đang ẩn mới có nút này, dùng để lộ diện sớm.</li>
<li>⚔️ <b>Tấn công:</b> sáng lên khi có đối thủ cùng phòng sau khi Ma đã lộ diện.</li>
<li>🚪 <b>Mở cổng:</b> chỉ dùng được ở ô lối thoát (Cổng Sắt Sau), sau khi Cơn Ám bắt đầu. Bắt buộc phải giữ <b>🗝️ Chìa khóa + ít nhất 2 bảo vật</b>. Mở được là <b>ôm bảo vật bỏ trốn và thắng một mình</b> (🏃 Kẻ đào tẩu).</li>
<li>📓 <b>Sổ tay:</b> xem vai trò và các gợi ý bạn đang biết. Ma còn thấy các bảo vật đồng loại đã giấu và <b>chỉ số 💪🧠🏃 của mọi người</b> (cũng hiện trên thanh người chơi trong lượt của Ma).</li>
<li>📜 <b>Nhật ký:</b> xem lại diễn biến chung của ván.</li>
<li>Bấm <b>Kết thúc lượt ➜</b> để chuyển sang người tiếp theo.</li></ul>
<h3>Chiến thuật</h3><ul>
<li><b>Bí mật duy nhất:</b> vai trò (Người/Ma, kèm mục tiêu riêng & Bài Ma) và vị trí bảo vật bị Ma giấu. Mọi thẻ Sự kiện, mảnh gợi ý, chức năng phòng, bảo vật dùng đều công khai.</li>
<li><b>✨ Phòng có chức năng:</b> nhiều phòng có hành động riêng (in ở đáy tile): Thư viện cho mảnh gợi ý, Nhà nguyện hồi 🧠, Nhà bếp +💪… Dùng xong bạn dừng di chuyển (vẫn lục soát được), mỗi phòng cần 2 vòng để hồi.</li>
<li><b>🧩 Mảnh gợi ý:</b> thẻ Sự kiện không chỉ thẳng phòng nữa, mỗi mảnh chỉ nói 1 đặc điểm (tầng, ✦/☾, số cửa, chữ trong tên phòng). Mọi mảnh đều <b>công khai</b> trên <b>🧩 Bảng gợi ý</b> (góc trên bản đồ), bảng tự lọc ra các <b>phòng khớp</b> để cả bàn suy luận và tranh nhau tới trước. Coi chừng mảnh gợi ý sai do Ma lén gieo!</li>
<li><b>🎒 Bảo vật có sức mạnh:</b> 🧿 Trục ma, 🕯️ Soi bóng, 📔 Đọc nhật ký, 🔔 Rung chuông. Dùng thì bảo vật <b>tan biến và ẩn lại</b> trong nhà: giữ để thắng hay dùng để sống?</li>
<li><b>🃏 Bài Ma:</b> Ma có 1 lá từ đầu, mỗi lần bốc thẻ Sự kiện được thêm 1: 🪤 Bẫy hồn, 🔒 Khóa cửa, 🌫️ Gợi ý giả, 💨 Dời bảo vật, 🕸️ Mạng nhện. Mỗi lượt 1 lá. Nút 🎒 Túi giống nhau với mọi người nên không lộ vai.</li>

<h3>Xúc xắc &amp; bảng theo dõi</h3><ul><li>Mỗi khi cần đổ xúc xắc (giao chiến, mở cổng, sự kiện), người chơi <b>tự bấm 🎲 Tung</b>. Máy tự tung cho ghế 🤖.</li><li><b>📊 Bảng theo dõi</b> ở góc trên bản đồ: tầng đang đứng, 🏃 Tốc độ, 🧠 Tinh thần, bảo vật của mọi người. 💪 Sức mạnh của người khác hiện “?”. Ma xem được đầy đủ trong 📓 Sổ tay. Chạm tiêu đề để thu gọn.</li></ul>
<h3>3. Sự kiện Ngôi nhà</h3><ul><li>Cứ sau mỗi <b>10 lượt</b> (đếm ở ô 📜 trên đầu màn hình), một sự kiện ngẫu nhiên xảy ra với <b>tất cả</b> người chơi, cả Người lẫn Ma. Có sự kiện tốt, có sự kiện xấu: tăng/giảm Sức mạnh, Tinh thần, Tốc độ hoặc Ám, nhiều sự kiện yêu cầu mỗi người đổ xúc xắc.</li></ul>
<h3>4. Cơn Ám và giao chiến</h3><ul>
<li>Cơn Ám bắt đầu khi Tà khí đạt <b>${CFG.hauntAt}</b> hoặc tới vòng <b>${CFG.autoHaunt}</b>. Lúc đó mọi Ma lộ diện, được +1 bước và đi xuyên tường.</li>
<li>Khi giao chiến, Ma đổ xúc xắc theo 👻 Ám, Người đổ theo 💪 Sức mạnh (mỗi xúc xắc 0–2).</li>
<li>👻 Ám gốc là 3. Ma (vai gốc) khi hóa hình được <b>+${AM_REVEAL} Ám</b>; Người bị ám hóa Ma được <b>+${AM_CONVERT} Ám</b>.</li>
<li>Ma cao hơn: Người <b>bị ám</b>, mất 🧠 Tinh thần. Tinh thần về 0 thì Người <b>hóa Ma</b> và thấy được các bảo vật Ma đã giấu.</li>
<li>Người cao hơn: Ma bị choáng và mất lượt kế tiếp.</li>
<li>Người còn ≤ 2 Tinh thần trong Cơn Ám sẽ có vầng khói tím quanh chân (đang bị ám).</li></ul>
<h3>5. Chiến thắng</h3>
<p><b>Thắng theo phe</b> (cả phe cùng thắng, kể cả người bị biến thành Ma giữa chừng, lúc đó họ thuộc phe Ma):</p><ul>
<li>🧍 <b>Phe Người:</b> gom đủ <b>${CFG.need}/4 bảo vật</b> (🧿🕯️📔🔔).</li>
<li>👻 <b>Phe Ma:</b> biến hết Người thành Ma, hoặc cầm chân tới vòng <b>${CFG.roundLimit}</b>.</li></ul>
<p><b>Thắng một mình</b> (kết thúc ván ngay, mọi người khác đều thua):</p><ul>

<p><b>Thứ tự ưu tiên:</b> nếu nhiều điều kiện xảy ra cùng lúc, thắng một mình được tính trước thắng theo phe.</p>

/* ---------- state snapshot ---------- */
function snap(){
  const o={};for(const k in S){if(['decks','events','omens','hevents','pending','frags','empty'].includes(k))continue;o[k]=S[k];}
  o.deckLen={A:S.decks.A.length,G:S.decks.G.length,B:S.decks.B.length};
  o.frags=S.frags;o.empty=[...S.empty];o.log=S.log.slice(-60);
  o.players=S.players.map(p=>{const q={...p};delete q.frags;delete q.searchedRooms;q.goal=p.goal?p.goal.id:null;q.st={...p.st,floors:[...p.st.floors]};return q;});
  return o;
}
function applySnap(o){
  const prev=S&&cur()?{t:S.turn,k:pk(cur())}:null;
  o.empty=new Set(o.empty);o.decks={};for(const f of ['A','G','B'])o.decks[f]=new Array(o.deckLen[f]).fill(0);
  o.players.forEach(p=>{p.st.floors=new Set(p.st.floors);p.goal=p.goal?GOALS.find(g=>g.id===p.goal):null;p.frags=o.frags;p.searchedRooms=o.empty;});
  S=o;NET.wait=false;
  {const m=$('#modal');if(m.dataset.kind==='spect'&&(o.mid==null||NET.spect!==o.mid)&&!m._rolling)closeOverlay();}
  if(NET.mine!=null&&o.mid!==NET.mine&&NET.closed.has(NET.mine)){NET.mine=null;closeMine();}
  const c=cur();
  if(!prev||prev.t!==S.turn||prev.k!==pk(c)){NET.view=c.f;G3.focus(c);}
  S.view=NET.view||c.f;
  render();
}
function broadcastState(){if(!(NET.on&&NET.host&&S))return;clearTimeout(NET.bcT);NET.bcT=setTimeout(()=>netSend({t:'state',s:snap()}),40);}

/* ---------- modal & dice routing (host) ---------- */
function waitAns(id,pid){return new Promise(res=>{NET.pending[id]={res,pid};});}
function resolvePendingFor(pid){for(const id in NET.pending){if(NET.pending[id].pid===pid){NET.pending[id].res(null);delete NET.pending[id];}}}
function spectate(msg,who){
  const m=$('#modal');NET.spect=msg.id;
  m.innerHTML=`<div class="card ${msg.cls||''}">${msg.html}<div class="btns"><button disabled style="opacity:.6">⏳ Đang chờ ${esc(who)}…</button></div></div>`;
  m.classList.add('on');m.classList.toggle('soft',/\bsoft\b/.test(msg.cls||''));m.onclick=null;m._finish=null;m.dataset.kind='spect';
}
function closeOverlay(){const m=$('#modal');m._finish=null;m.dataset.kind='';m.classList.remove('on','soft');m.innerHTML='';m.onclick=null;NET.spect=null;}
function closeMine(){const m=$('#modal');m.classList.remove('on','soft');m.innerHTML='';m.onclick=null;}
function closeSpect(id){if(NET.spect===id)closeOverlay();}
async function hostModal(html,buttons,cls){
  const to=S.modalTo!=null?S.modalTo:cur().id;S.modalTo=null;
  const tp=S.players[to],priv=/class="secret"/.test(html),id=++NET.seq;
  S.mid=id;broadcastState();
  netSend({t:'modal',id,html,buttons:buttons.map(b=>({t:b.t,c:b.c})),cls,to,priv,who:tp?tp.name:''});
  let i;
  if(tp&&isLocal(tp)){const v=await localModal(html,buttons,cls);i=buttons.findIndex(b=>b.v===v);}
  else{
    if(!priv)spectate({id,html,cls},tp?tp.name:'');
    if(!tp||tp.bot){await new Promise(r=>setTimeout(r,2600));i=buttons.length-1;}
    else{i=await waitAns(id,to);if(i==null||!buttons[i])i=buttons.length-1;}
    closeSpect(id);
  }
  S.mid=null;netSend({t:'close',id});broadcastState();
  return buttons[Math.max(0,i)].v;
}
function diceUI(r,n,title,sub,soft,interactive,who){
  const m=$('#modal');
  return new Promise(res=>{
    m.innerHTML=`<div class="card ev"><div class="kind">🎲 ${interactive?'Tự tung xúc xắc':'Đang tung xúc xắc'}</div><h2>${title}</h2><p>${sub}</p><div class="dice" id="dz">${r.map(()=>'<div class="die q">?</div>').join('')}</div><div class="dsum" id="dsum">Mỗi xúc xắc ra 0, 1 hoặc 2 chấm.</div><div class="btns">${interactive?`<button class="pri" id="dbtn">🎲 Tung ${n} xúc xắc</button>`:`<button disabled style="opacity:.6">⏳ ${esc(who||'')} đang tung…</button>`}</div></div>`;
    m.classList.add('on');m.classList.toggle('soft',!!soft);m.onclick=null;
    const face=v=>v?'●'.repeat(v):'·';
    const roll=async()=>{const ds=[...document.querySelectorAll('#dz .die')];
      for(let t=0;t<12;t++){ds.forEach(d=>{const v=pick([0,1,2]);d.className='die roll'+(v?'':' z');d.textContent=face(v)});await wait(65);}
      ds.forEach((d,i)=>{d.className='die land'+(r[i]?'':' z');d.textContent=face(r[i])});
      const s=$('#dsum');if(s)s.innerHTML=`Tổng: <b>${sum(r)}</b>`;};
    m.dataset.kind=interactive?'local':'spect';
    if(!interactive){m._finish=async(rr)=>{m._finish=null;r=rr||r;await roll();await wait(1100);if(m.dataset.kind==='spect'){m.classList.remove('on','soft');m.innerHTML='';m.dataset.kind='';}res(r);};return;}
    const btn=$('#dbtn');let stage=0;
    btn.onclick=async()=>{
      if(stage===0){stage=1;btn.disabled=true;await roll();btn.disabled=false;btn.textContent='Tiếp';stage=2;}
      else if(stage===2){m.classList.remove('on','soft');m.innerHTML='';res(r);}
    };
  });
}

/* ---------- client side ---------- */
function onNet(msg){
  if(!msg||typeof msg!=='object')return;
  if(NET.host){
    if(msg.from===NET.cid)return;
    if(msg.t==='hello'){NET.seenAt[msg.from]=Date.now();NET.peers[msg.from]={name:msg.name};renderOnline();
      if(S&&NET.started){const p=S.players.find(q=>q.owner===msg.from);
        if(p&&p.takeover){p.bot=false;p.takeover=false;log(`🔌 ${p.name} đã kết nối lại.`);}
        netSend({t:'start',to:msg.from,pid:p?p.id:null,s:snap()});}
      else netSend({t:'lobby',list:lobbyList()});
      return;}
    if(msg.t==='bye'){delete NET.peers[msg.from];renderOnline();netSend({t:'lobby',list:lobbyList()});return;}
    if(msg.t==='ping'){NET.seenAt[msg.from]=Date.now();return;}
    if(msg.t==='ans'){const pd=NET.pending[msg.id];if(pd){const p=S.players[pd.pid];if(p&&p.owner===msg.from){delete NET.pending[msg.id];pd.res(msg.i);}}return;}
    if(msg.t==='act'){if(!S||S.over)return;const p=cur();if(!p||p.owner!==msg.from||p.bot||S.busy)return;const fn=ACTIONS[msg.a];if(fn)fn(msg.args||{});return;}
    if(msg.t==='sync'){broadcastState();return;}
    return;
  }
  // client
  if(msg.t==='lobby'){NET.lobby=msg.list;renderOnline();return;}
  if(msg.t==='start'){if(msg.to&&msg.to!==NET.cid)return;
    const first=!NET.started;NET.started=true;
    const mine=msg.s.players.find(p=>p.owner===NET.cid);NET.myPid=mine?mine.id:null;
    G3.reset();applySnap(msg.s);$('#setup').style.display='none';
    if(first&&mine)localModal(notebook(S.players[NET.myPid]),[{t:'Đã nhớ vai',v:1,c:'pri'}],mine.role==='ghost'?'gh':'');
    return;}
  if(!NET.started)return;
  if(msg.t==='state'){applySnap(msg.s);return;}
  if((msg.t==='modal'||msg.t==='dice')&&(NET.closed.has(msg.id)||(S&&S.mid!==undefined&&S.mid!==null&&S.mid>msg.id)))return;
  if(msg.t==='modal'){
    if(msg.to===NET.myPid){NET.mine=msg.id;const bs=msg.buttons.map((b,i)=>({...b,v:i}));localModal(msg.html,bs,msg.cls).then(i=>{NET.mine=null;netSend({t:'ans',id:msg.id,i})});}
    else if(!msg.priv)spectate(msg,msg.who);
    return;}
  if(msg.t==='dice'){
    if(msg.to===NET.myPid){NET.mine=msg.id;diceUI(msg.r,msg.n,msg.title,msg.sub,msg.soft,true).then(()=>{NET.mine=null;netSend({t:'ans',id:msg.id,i:0})});}
    else{NET.spect=msg.id;diceUI(msg.r,msg.n,msg.title,msg.sub,msg.soft,false,msg.who);}
    return;}
  if(msg.t==='close'){NET.closed.add(msg.id);if(NET.mine===msg.id){NET.mine=null;closeMine();}const m=$('#modal');if(NET.spect===msg.id){NET.spect=null;if(m._finish){m._rolling=true;m._finish(msg.r).then(()=>m._rolling=false);}else closeOverlay();}return;}
  if(msg.t==='fx'){const args=(msg.args||[]).map(a=>a&&a.__p!==undefined?S.players[a.__p]:a);try{FX_ORIG[msg.n](...args)}catch(e){}return;}
  if(msg.t==='vig'){vignetteLocal(msg.k,msg.ms);return;}
  if(msg.t==='toast'){toastLocal(msg.m);return;}
  if(msg.t==='end'){applySnap(msg.s);showEnd(msg.side,msg.why,msg.hero!=null?S.players[msg.hero]:null);return;}
}
function lobbyList(){return [{cid:NET.cid,name:onlineName(),host:true},...Object.entries(NET.peers).map(([cid,v])=>({cid,name:v.name}))];}
function onlineName(){if(NET.name)return NET.name;const i=$('#onName');return (i&&i.value.trim())||seatCfg[0].name||'Người chơi';}

async function joinRoom(code,asHost){
  if(!ROOMCAP){$('#onErr').textContent='Trang này hiện không kết nối được máy chủ chung (cần mở artifact trên claude.ai, có quyền tương tác).';return false;}
  try{
    NET.name=onlineName();NET.sub=await ROOMCAP.join('wm-'+code);
    NET.sub.on('g',(d)=>{try{onNet(d&&d.data!==undefined&&d.t===undefined?d.data:d)}catch(e){console.error(e)}});
    NET.on=true;NET.host=asHost;NET.code=code;
    try{NET.sub.presence({cid:NET.cid,name:onlineName(),host:asHost})}catch(e){}
    if(!asHost)netSend({t:'hello',name:onlineName()});
    clearInterval(NET.pingT);NET.pingT=setInterval(()=>{if(!NET.host)netSend({t:'ping'});else{checkPeers();if(S&&NET.started)netSend({t:'state',s:snap()});}},3000);
    return true;
  }catch(e){$('#onErr').textContent='Không vào được phòng: '+(e&&e.message||e);return false;}
}
function checkPeers(){
  if(!S||!NET.started||S.over)return;
  const now=Date.now();
  S.players.forEach(p=>{if(!p.owner||p.owner===NET.cid||p.bot)return;
    if(now-(NET.seenAt[p.owner]||0)>20000){p.bot=true;p.takeover=true;log(`📴 ${p.name} mất kết nối – máy chơi thay.`);toast(`📴 ${p.name} mất kết nối – 🤖 chơi thay`);
      resolvePendingFor(p.id);
      if(cur()===p&&!S.busy){render();runTurns();}else render();}});
}
async function hostStart(){
  const list=lobbyList();const N=setupH+setupG;
  if(list.length>N){$('#onErr').textContent=`Phòng có ${list.length} người nhưng ván chỉ có ${N} chỗ. Hãy tăng số Người/Ma.`;return;}
  list.forEach((l,i)=>{seatCfg[i]={name:l.name,bot:false,owner:l.cid};});
  for(let i=list.length;i<N;i++)seatCfg[i]={name:DEFAULT_NAMES[i],bot:true};
  G3.reset();newGame(setupH,setupG);NET.started=true;
  S.players.forEach((p,i)=>{p.owner=seatCfg[i].owner||null;});
  NET.myPid=S.players.find(p=>p.owner===NET.cid).id;
  list.forEach(l=>NET.seenAt[l.cid]=Date.now());
  $('#setup').style.display='none';render();G3.focus(S.players[NET.myPid]);
  netSend({t:'start',s:snap()});
  await localModal(notebook(S.players[NET.myPid]),[{t:'Đã nhớ vai',v:1,c:'pri'}],S.players[NET.myPid].role==='ghost'?'gh':'');
  log('Cánh cửa chính đóng sầm lại sau lưng cả nhóm…');
  runTurns();
}

  if(NET.host){const list=lobbyList();
    box.innerHTML=`<div style="text-align:center"><div style="font-size:13px;color:var(--muted)">Mã phòng</div><div style="font-size:40px;font-weight:900;letter-spacing:8px;color:var(--gold)">${NET.code}</div></div>
     <p style="font-size:13px;margin:6px 0">Đã vào phòng (${list.length}):</p><div>${list.map((l,i)=>`<div class="seat"><div class="dot" style="background:${CHARS[i%CHARS.length].c}">${i+1}</div><span style="flex:1">${esc(l.name)}${l.host?' 👑 (bạn)':''}</span></div>`).join('')}</div>
     <p style="font-size:12px;color:var(--muted)">Chỉnh số 🧍 Người / 👻 Ma ở trên; ghế còn trống sẽ do 🤖 máy chơi.</p>
     <button class="big" id="onStart">▶ Bắt đầu ván online</button><div class="err" id="onErr"></div>`;return;}
  box.innerHTML=`<div style="text-align:center"><div style="font-size:13px;color:var(--muted)">Đã vào phòng</div><div style="font-size:40px;font-weight:900;letter-spacing:8px;color:var(--gold)">${NET.code}</div></div>
    <p style="font-size:13px;margin:6px 0">Người trong phòng:</p><div>${(NET.lobby.length?NET.lobby:[{name:onlineName()}]).map((l,i)=>`<div class="seat"><div class="dot" style="background:${CHARS[i%CHARS.length].c}">${i+1}</div><span style="flex:1">${esc(l.name)}${l.host?' 👑':''}${l.cid===NET.cid?' (bạn)':''}</span></div>`).join('')}</div>
    <p style="text-align:center;color:var(--muted)">⏳ Đang chờ chủ phòng bắt đầu…</p><div class="err" id="onErr"></div>`;
}
document.addEventListener('click',async e=>{
  const id=e.target&&e.target.id;
  if(id==='onHost'){const code=Math.random().toString(36).slice(2,6).toUpperCase();if(await joinRoom(code,true))renderOnline();}
  if(id==='onJoin'){const code=($('#onCode').value||'').trim().toUpperCase();if(code.length<3){$('#onErr').textContent='Nhập mã phòng chủ phòng đưa cho bạn.';return;}if(await joinRoom(code,false))renderOnline();}
  if(id==='onStart')hostStart();
});

/* ================= SETUP ================= */
const CFG_DEF=[['hauntAt','Tà khí kích hoạt Cơn Ám',3,10,1],['autoHaunt','Vòng tự kích hoạt Cơn Ám',4,20,1],['roundLimit','Vòng cuối (Ma thắng)',10,40,5],['need','Bảo vật Người cần gom',1,4,1]];
function renderSetup(){
  const N=setupH+setupG;
  $('#cnts').innerHTML=[['h','🧍 Người',setupH],['g','👻 Ma',setupG]].map(([k,l,v])=>`<div class="cfg"><span>${l}</span><button data-cnt="${k}:-1">−</button><b>${v}</b><button data-cnt="${k}:1">+</button></div>`).join('');
  $('#split').innerHTML=`Tổng <b>${N}/${MAXP}</b> người chơi · vai trò chia bí mật ngẫu nhiên (tối thiểu 2 Người, 1 Ma)`;
  $('#seats').innerHTML=seatCfg.slice(0,N).map((s,i)=>`<div class="seat"><div class="dot" style="background:${CHARS[i].c}">${i+1}</div>
    <input data-name="${i}" value="${esc(s.name)}" maxlength="12"><div class="tog"><button data-bot="${i}:0" class="${s.bot?'':'on'}">🧑 Người chơi</button><button data-bot="${i}:1" class="${s.bot?'on':''}">🤖 Máy</button></div></div>`).join('');
  $('#cfgs').innerHTML=CFG_DEF.map(([k,l])=>`<div class="cfg"><span>${l}</span><button data-c="${k}:-1">−</button><b>${CFG[k]}</b><button data-c="${k}:1">+</button></div>`).join('');
}

$('#cnts').addEventListener('click',e=>{const b=e.target.closest('[data-cnt]');if(!b)return;const[k,d]=b.dataset.cnt.split(':');const dv=+d;
  if(k==='h'){const v=setupH+dv;if(v>=2&&v+setupG<=MAXP)setupH=v;}else{const v=setupG+dv;if(v>=1&&setupH+v<=MAXP)setupG=v;}renderSetup();});
$('#seats').addEventListener('click',e=>{const b=e.target.closest('[data-bot]');if(b){const[i,v]=b.dataset.bot.split(':');seatCfg[i].bot=v==='1';renderSetup();}});
$('#seats').addEventListener('input',e=>{const i=e.target.dataset.name;if(i!==undefined)seatCfg[i].name=e.target.value;});
$('#cfgs').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;const[k,d]=b.dataset.c.split(':');const def=CFG_DEF.find(x=>x[0]===k);
  CFG[k]=Math.max(def[2],Math.min(def[3],CFG[k]+(+d)*def[4]));
  if(CFG.autoHaunt>=CFG.roundLimit)CFG.autoHaunt=CFG.roundLimit-1;renderSetup();});
$('#rulesBtn').onclick=()=>localModal(rulesHTML(),[{t:'Đã hiểu',v:1,c:'pri'}]);
$('#startBtn').onclick=async()=>{
  if(!seatCfg.slice(0,setupH+setupG).some(s=>!s.bot)){$('#err').textContent='Cần ít nhất 1 người chơi thật.';return;}
  $('#err').textContent='';
  G3.reset();newGame(setupH,setupG);$('#setup').style.display='none';render();G3.focus(S.players[0]);
  const hs=S.players.filter(p=>!p.bot);
  for(const p of hs){
    if(hs.length>=2)await localModal(`<div class="kind">Chia vai bí mật</div><h2>Đưa máy cho ${esc(p.name)}</h2><p>Những người khác đừng nhìn màn hình!</p>`,[{t:'Tôi là '+esc(p.name),v:1,c:'pri'}]);
    await localModal(notebook(p),[{t:'Đã nhớ vai',v:1,c:'pri'}],p.role==='ghost'?'gh':'');
  }
  log('Cánh cửa chính đóng sầm lại sau lưng cả nhóm…');
  runTurns();
};
function showSetup(){$('#setup').style.display='block';renderSetup();renderOnline();}
renderSetup();
</script>
